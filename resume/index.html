<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - Lukas White</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=Manrope&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
}

#bg-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* =========================
   WELCOME PANEL
   ========================= */
.welcome-container {
  position: relative;
  z-index: 1;
  max-width: 500px;
  width: 80%;
  background: rgba(30, 30, 30, 0.55);
  padding: 60px 40px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 0 60px rgba(0,0,0,0.7);
  color: #d4d4d4;

  /* Start invisible */
  opacity: 0;
  transform: translateY(20px);

  /* Animate fade-in */
  animation: fadeIn 4.0s ease-out forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.welcome-container h1 {
  font-family: 'Anton', sans-serif;
  font-size: 3rem;
  color: #569cd6;
  margin-bottom: 20px;
}

.welcome-container p {
  font-size: 1.2rem;
  color: #9cdcfe;
  margin-bottom: 30px;
}

.continue-btn {
  font-family: 'Manrope', sans-serif;
  font-size: 1rem;
  padding: 14px 30px;
  border: none;
  border-radius: 8px;
  background-color: #3f51b5;
  color: white;
  cursor: pointer;
  transition: background-color 0.3s, transform 0.2s;
}

.continue-btn:hover {
  background-color: #303f9f;
  transform: translateY(-2px);
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="welcome-container">
  <h1>Welcome!</h1>
  <p>Hi, I’m Lukas White.<br>Explore my portfolio to see projects, skills, and more.</p>
  <button class="continue-btn" onclick="goHome()">Continue</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script>
const canvas = document.getElementById('bg-canvas');
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 6;

// Renderer
const renderer = new THREE.WebGLRenderer({canvas, alpha: true, antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

// Cube with thick edges
const geometry = new THREE.BoxGeometry(3, 3, 3);
const edges = new THREE.EdgesGeometry(geometry);
const material = new THREE.LineBasicMaterial({ color: 0x569cd6, linewidth: 2 });
const cube = new THREE.LineSegments(edges, material);
scene.add(cube);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xffffff, 0.8);
pointLight.position.set(5,5,5);
scene.add(pointLight);

// Animate cube
function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.004;
    cube.rotation.y += 0.006;
    renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Button
function goHome() {
    window.location.href = 'home.html';
}
</script>

</body>
</html>
