<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Collection Game</title>
<style>
body{
  margin:0;
  overflow:hidden;
  background:#7ec0ee;
  font-family:Arial;
}
canvas{
  display:block;
  margin:auto;
  background:#4caf50;
}
#ui{
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-weight:bold;
  text-shadow:2px 2px 4px black;
}
.screen{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#1b5e20;
  color:white;
  padding:30px;
  border-radius:12px;
  text-align:center;
  display:none;
}
button{
  padding:12px 24px;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}
</style>
</head>
<body>

<div id="ui"></div>

<div id="start" class="screen">
<h1>Collection Game 🌱</h1>
<p>Collect all treasures</p>
<button onclick="startGame()">Start</button>
</div>

<div id="win" class="screen">
<h1>Victory 🏆</h1>
<button onclick="startGame()">Play Again</button>
</div>

<div id="gameover" class="screen">
<h1>Game Over 💀</h1>
<button onclick="startGame()">Retry</button>
</div>

<canvas id="game" width="900" height="600"></canvas>

<script>
/*
========================================
PROJECT SYSTEM DESIGN
========================================
GOAL
----------------------------------------
Collect all treasures and bring them
to the Onion while protecting Pikmin.

CORE SYSTEMS
----------------------------------------
1. Onion Base
   - Safe zone for Pikmin
   - Enemy attacks disabled inside radius

2. Pikmin System
   - 3 types:
        Red   = stronger carriers
        Blue  = faster movement
        Yellow= longer throw
   - Pikmin can:
        idle
        walk
        carry
        get stuck on rocks
        be recalled by whistle

3. Treasure Objects
   - Require N Pikmin to carry
   - Extra Pikmin increase speed

4. Enemy Types
   Turret
        stationary guard

   Patrol
        moves between 2-3 patrol points

   Hunter
        spawns from screen edges
        slowly moves toward onion
        hunts Pikmin if detected

5. Obstacles
   - Rock traps
   - Pikmin become stuck when touching
   - Freed by whistle

6. Player Controls
   Left click  → throw Pikmin
   Right click → whistle recall

7. Game States
   START
   RUNNING
   VICTORY
   GAME OVER
========================================

Fixes for AI to make:
1. Pikmin need to carry items, they don't right now. 'bug'
Also, when more are holding than needed, they move faster

2. When the pikmin touches the onion, they are reabsorbed into the onion
like how they are at spawn, not exposed to the open world

3. Pikmin and the onion should have hp, not automatically die. Pikmin should
have less as their strengths are in numbers.

4. idle pikmin in the field should be able to make decisions...
like if an enemy is near, to attack them, or if an object/teasure grab onto 'em.

5. There should be 3 enemies: static, traversing between 2 static points, and then the hunger attacking ones.

6. the attacking ones should target the onion, but if a pikmin is closer, then they should target the pikmin.

*/

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

const ui=document.getElementById("ui")
const startScreen=document.getElementById("start")
const winScreen=document.getElementById("win")
const gameOverScreen=document.getElementById("gameover")

// Game state
let running=false

// Onion base
const base={ x:450, y:300, r:70 }

// Whistle indicator
let whistle={x:0,y:0,r:80,show:false}

// Game objects
let pikmin=[]
let objects=[]
let enemies=[]
let rocks=[]

let delivered=0
let pikminMax=20
let pikminAvailable=20

function rand(a,b){return Math.random()*(b-a)+a}
function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2)}

const TYPES=["red","blue","yellow"]

/* ================== Pikmin Class ================== */
class Pikmin{
  constructor(type,x,y){
    this.type=type
    this.x=x
    this.y=y
    this.tx=x
    this.ty=y
    this.target=null
    this.stuck=false
    this.speed=1.4
    if(type==="blue") this.speed=1.8
  }
  update(){
    if(this.stuck) return
    let dx=this.tx-this.x
    let dy=this.ty-this.y
    let d=Math.hypot(dx,dy)
    if(d>1){
      this.x+=dx/d*this.speed
      this.y+=dy/d*this.speed
    }
    rocks.forEach(r=>{
      if(dist(this.x,this.y,r.x,r.y)<r.r){
        this.stuck=true
      }
    })
  }
  draw(){
    let color={ red:"#ff4040", blue:"#4090ff", yellow:"#ffd740" }[this.type]
    ctx.fillStyle=color
    ctx.beginPath()
    ctx.arc(this.x,this.y,7,0,Math.PI*2)
    ctx.fill()

    // Simple health indicator placeholder (for future)
    ctx.strokeStyle="green"
    ctx.beginPath()
    ctx.moveTo(this.x,this.y-7)
    ctx.lineTo(this.x,this.y-16)
    ctx.stroke()
  }
}

/* ================== Rock Class ================== */
class Rock{
  constructor(){
    this.x=rand(100,800)
    this.y=rand(100,500)
    this.r=30
  }
  draw(){
    ctx.fillStyle="#666"
    ctx.beginPath()
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2)
    ctx.fill()
  }
}

/* ================== Treasure Class ================== */
class Treasure{
  constructor(){
    this.x=rand(100,800)
    this.y=rand(100,500)
    this.r=24
    this.need=Math.floor(rand(3,7))
    this.pikmin=[]
  }
  update(){
    if(this.pikmin.length>=this.need){
      let dx=base.x-this.x
      let dy=base.y-this.y
      let d=Math.hypot(dx,dy)
      let extra=this.pikmin.length-this.need
      let speed=0.6+extra*0.12
      this.x+=dx/d*speed
      this.y+=dy/d*speed
      this.pikmin.forEach(p=>{
        p.tx=this.x
        p.ty=this.y
      })
      if(d<50){
        delivered++
        objects.splice(objects.indexOf(this),1)
        if(objects.length===0){
          running=false
          winScreen.style.display="block"
        }
      }
    }
  }
  draw(){
    ctx.fillStyle="#d4af37"
    ctx.beginPath()
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2)
    ctx.fill()
    ctx.fillStyle="black"
    ctx.textAlign="center"
    ctx.fillText(this.need-this.pikmin.length,this.x,this.y+4)
  }
}

/* ================== Enemy Classes ================== */
class TurretEnemy{
  constructor(){
    this.x=rand(100,800)
    this.y=rand(100,500)
    this.range=100
  }
  update(){
    pikmin.forEach(p=>{
      if(dist(this.x,this.y,p.x,p.y)<this.range){
        if(dist(p.x,p.y,base.x,base.y)>base.r){
          pikmin.splice(pikmin.indexOf(p),1)
        }
      }
    })
  }
  draw(){
    ctx.fillStyle="purple"
    ctx.beginPath()
    ctx.arc(this.x,this.y,16,0,Math.PI*2)
    ctx.fill()
  }
}

class PatrolEnemy{
  constructor(){
    this.points=[
      {x:rand(100,800),y:rand(100,500)},
      {x:rand(100,800),y:rand(100,500)},
      {x:rand(100,800),y:rand(100,500)}
    ]
    this.i=0
    this.x=this.points[0].x
    this.y=this.points[0].y
    this.speed=0.6
  }
  update(){
    let target=this.points[this.i]
    let dx=target.x-this.x
    let dy=target.y-this.y
    let d=Math.hypot(dx,dy)
    this.x+=dx/d*this.speed
    this.y+=dy/d*this.speed
    if(d<5) this.i=(this.i+1)%this.points.length
    pikmin.forEach(p=>{
      if(dist(this.x,this.y,p.x,p.y)<15){
        if(dist(p.x,p.y,base.x,base.y)>base.r){
          pikmin.splice(pikmin.indexOf(p),1)
        }
      }
    })
  }
  draw(){
    ctx.fillStyle="#aa00ff"
    ctx.beginPath()
    ctx.arc(this.x,this.y,14,0,Math.PI*2)
    ctx.fill()
  }
}

class HunterEnemy{
  constructor(){
    let side=Math.floor(rand(0,4))
    if(side===0){this.x=0;this.y=rand(0,600)}
    if(side===1){this.x=900;this.y=rand(0,600)}
    if(side===2){this.x=rand(0,900);this.y=0}
    if(side===3){this.x=rand(0,900);this.y=600}
    this.speed=0.5
  }
  update(){
    let target={x:base.x,y:base.y}
    pikmin.forEach(p=>{
      if(dist(this.x,this.y,p.x,p.y)<120){
        target=p
      }
    })
    let dx=target.x-this.x
    let dy=target.y-this.y
    let d=Math.hypot(dx,dy)
    this.x+=dx/d*this.speed
    this.y+=dy/d*this.speed
    pikmin.forEach(p=>{
      if(dist(this.x,this.y,p.x,p.y)<15){
        if(dist(p.x,p.y,base.x,base.y)>base.r){
          pikmin.splice(pikmin.indexOf(p),1)
        }
      }
    })
  }
  draw(){
    ctx.fillStyle="red"
    ctx.beginPath()
    ctx.arc(this.x,this.y,18,0,Math.PI*2)
    ctx.fill()
  }
}

/* ================== Spawn World ================== */
function spawnWorld(){
  objects=[]
  rocks=[]
  enemies=[]
  for(let i=0;i<5;i++) objects.push(new Treasure())
  for(let i=0;i<6;i++) rocks.push(new Rock())
  for(let i=0;i<2;i++) enemies.push(new TurretEnemy())
  for(let i=0;i<2;i++) enemies.push(new PatrolEnemy())
  for(let i=0;i<2;i++) enemies.push(new HunterEnemy())
}

/* ================== Player Controls ================== */
function throwPikmin(x,y){
  if(!running) return
  if(pikminAvailable<=0) return
  let type=TYPES[Math.floor(Math.random()*3)]
  let p=new Pikmin(type,base.x,base.y)
  p.tx=x
  p.ty=y
  pikmin.push(p)
  pikminAvailable--
}

function whistleRecall(x,y){
  whistle.x=x
  whistle.y=y
  whistle.show=true
  pikmin.forEach(p=>{
    if(dist(p.x,p.y,x,y)<whistle.r){
      p.stuck=false
      p.target=null
      p.tx=base.x
      p.ty=base.y
    }
  })
  setTimeout(()=>whistle.show=false,200)
}

canvas.addEventListener("mousedown",e=>{
  let rect=canvas.getBoundingClientRect()
  let x=e.clientX-rect.left
  let y=e.clientY-rect.top
  if(e.button===0) throwPikmin(x,y)
  if(e.button===2) whistleRecall(x,y)
})
canvas.oncontextmenu=e=>e.preventDefault()

/* ================== Game Loop ================== */
function update(){
  if(!running) return
  pikmin.forEach(p=>p.update())
  objects.forEach(o=>o.update())
  enemies.forEach(e=>e.update())
  if(pikmin.length===0 && pikminAvailable===0){
    running=false
    gameOverScreen.style.display="block"
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height)

  // patterned background
  ctx.fillStyle="rgba(0,255,0,0.1)"
  for(let i=0;i<900;i+=40){
    for(let j=0;j<600;j+=40){
      ctx.fillRect(i,j,20,20)
    }
  }

  // base
  ctx.beginPath()
  ctx.arc(base.x,base.y,base.r,0,Math.PI*2)
  ctx.fillStyle="#795548"
  ctx.fill()
  ctx.beginPath()
  ctx.arc(base.x,base.y,base.r+10,0,Math.PI*2)
  ctx.strokeStyle="rgba(0,255,255,0.3)"
  ctx.lineWidth=6
  ctx.stroke()

  rocks.forEach(r=>r.draw())
  objects.forEach(o=>o.draw())
  pikmin.forEach(p=>p.draw())
  enemies.forEach(e=>e.draw())

  // whistle indicator
  if(whistle.show){
    ctx.beginPath()
    ctx.arc(whistle.x,whistle.y,whistle.r,0,Math.PI*2)
    ctx.strokeStyle="cyan"
    ctx.lineWidth=3
    ctx.stroke()
  }

  ui.innerText=`Available: ${pikminAvailable} | Field: ${pikmin.length} | Delivered: ${delivered}`
}

function loop(){
  update()
  draw()
  requestAnimationFrame(loop)
}

/* ================== Start Game ================== */
function startGame(){
  pikmin=[]
  objects=[]
  rocks=[]
  enemies=[]
  delivered=0
  pikminAvailable=pikminMax
  spawnWorld()

  startScreen.style.display="none"
  winScreen.style.display="none"
  gameOverScreen.style.display="none"

  running=true
}

// Show start screen at beginning
startScreen.style.display = 'block'
winScreen.style.display = 'none'
gameOverScreen.style.display = 'none'

loop()
</script>

</body>
</html>
