<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lukas A. White — The Almighty</title>

    <style>
        @keyframes floatGradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    #fff87a 0%,
                    #ffff00 45%,
                    #f4e900 100%
                );

            color: #18181b;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h1 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;

            color: #3f3f46;

            margin: 0 0 0.5rem 0;

            font-weight: 700;
        }

        h2 {
            font-size: 2.25rem;

            margin: 0 0 2.5rem 0;

            font-weight: 800;
            letter-spacing: -0.03em;

            background:
                linear-gradient(
                    135deg,
                    #18181b,
                    #4f46e5,
                    #db2777,
                    #ea580c,
                    #18181b
                );

            background-size: 300% 300%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: floatGradient 8s ease infinite;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .nav-item {
            position: relative;

            display: flex;
            align-items: center;

            width: 100%;
            min-height: 62px;

            padding: 1rem 1.25rem 1rem 1.5rem;

            /* Dark, but not completely flat */
            background:
                linear-gradient(
                    135deg,
                    #18181b,
                    #27272a
                );

            border: 2px solid rgba(24, 24, 27, 0.15);

            border-radius: 14px;

            color: #ffff00;

            text-decoration: none;

            font-size: 0.95rem;
            font-weight: 700;

            overflow: hidden;

            box-shadow:
                0 5px 0 rgba(24, 24, 27, 0.25),
                0 8px 18px rgba(0, 0, 0, 0.12);

            transition:
                transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        /* Colored stripe */
        .nav-item::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 6px;

            background: #ffff00;

            transition: width 0.2s ease;
        }

        /* Subtle colored glow */
        .nav-item::after {
            content: "";

            position: absolute;

            width: 140px;
            height: 140px;

            right: -80px;
            top: -80px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.06);

            transition: transform 0.3s ease;
        }

        /* Games = purple */
        .nav-item:nth-child(1)::before {
            background: linear-gradient(
                #8b5cf6,
                #6366f1
            );
        }

        /* Learning = blue */
        .nav-item:nth-child(2)::before {
            background: linear-gradient(
                #22d3ee,
                #3b82f6
            );
        }

        /* Resume = pink/orange */
        .nav-item:nth-child(3)::before {
            background: linear-gradient(
                #f472b6,
                #fb923c
            );
        }

        .nav-item:hover {
            transform: translateY(-3px);

            border-color: rgba(24, 24, 27, 0.4);

            box-shadow:
                0 7px 0 rgba(24, 24, 27, 0.25),
                0 14px 25px rgba(0, 0, 0, 0.18);
        }

        .nav-item:hover::before {
            width: 10px;
        }

        .nav-item:hover::after {
            transform: scale(1.5);
        }

        .nav-item:active {
            transform: translateY(1px);

            box-shadow:
                0 2px 0 rgba(24, 24, 27, 0.25),
                0 5px 10px rgba(0, 0, 0, 0.12);
        }

        .nav-item:focus-visible {
            outline: 3px solid #18181b;
            outline-offset: 4px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Lukas A. White</h1>

        <h2>The Almighty</h2>

        <div class="nav-list">

            <!-- Take to /Games/index.html -->
            <a href="./Games/index.html" class="nav-item">
                Games
            </a>

            <!-- Take to /Learning/index.html -->
            <a href="./Learning/index.html" class="nav-item">
                Learning
            </a>

            <!-- Take to /Resume/index.html -->
            <a href="./resume/index.html" class="nav-item">
                Resume
            </a>

        </div>

    </div>

</body>
</html>
