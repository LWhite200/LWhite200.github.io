<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans, system-ui, sans-serif); min-height: 100vh; padding: 16px; transition: background 0.5s; }
body.theme-0 {
  background: #f5f5f3;
  color: #111;
  --bg-card-front: #ffffff;
  --text-card-main: #111111;
  --text-card-sub: #0c447c;
  --text-hint: rgba(0, 0, 0, 0.6);
}

body.theme-1 {
  background: #121212;
  color: #878787;
  /* Specific fixes for the dark mode cards: */
  --bg-card-front: #545454;       /* Dark-grey background for the card */
  --text-card-main: #f5f5f5;      /* Crisp white for the card text */
  --text-card-sub: #8bc34a;       /* Accessible light green accent for the card back */
  --text-hint: rgba(255, 255, 255, 0.6); /* Readable hint text */
}

body.theme-2 {
  background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #c77dff);
  background-size: 300% 300%;
  animation: rainbowShift 8s ease-in-out infinite;
}

@keyframes rainbowShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
  h2.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  .app { max-width: 640px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  .header-right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .stat { font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-secondary, #ece9e0); padding: 4px 10px; border-radius: 999px; }
  .stat.warn { color: #A32D2D; background: #FCEBEB; cursor: pointer; }
  .mode-bar { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
  .mode-btn { padding: 6px 16px; border-radius: 999px; border: 0.5px solid var(--color-border-secondary, rgba(0,0,0,0.3)); background: var(--color-background-primary, #fff); color: var(--color-text-secondary); font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .mode-btn.active { background: var(--color-text-primary, #1a1a1a); color: var(--color-background-primary, #fff); border-color: transparent; }
  .filter-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .filter-bar select { flex: 1; min-width: 130px; padding: 8px 10px; border-radius: 8px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); font-size: 13px; font-family: inherit; }
  .btn { padding: 8px 16px; border-radius: 8px; border: 0.5px solid var(--color-border-secondary, rgba(0,0,0,0.3)); background: var(--color-background-primary, #fff); color: var(--color-text-primary); font-size: 13px; cursor: pointer; transition: background 0.15s; font-family: inherit; white-space: nowrap; }
  .btn:hover { background: var(--color-background-secondary, #ece9e0); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: #185FA5; color: #fff; border-color: #185FA5; }
  .btn.primary:hover { background: #0C447C; }
  .btn.good { background: #3B6D11; color: #fff; border-color: #3B6D11; font-size: 14px; flex: 1; padding: 12px 6px; }
  .btn.good:hover { background: #27500A; }
  .btn.sorta { background: #8a6000; color: #fff; border-color: #8a6000; font-size: 14px; flex: 1; padding: 12px 6px; }
  .btn.sorta:hover { background: #6a4900; }
  .btn.bad { background: #A32D2D; color: #fff; border-color: #A32D2D; font-size: 14px; flex: 1; padding: 12px 6px; }
  .btn.bad:hover { background: #791F1F; }
  .score-pill.sorta { background: #FFF3CD; color: #8a6000; }
  .progress-bar { height: 3px; background: var(--color-border-tertiary, rgba(0,0,0,0.12)); border-radius: 2px; margin-bottom: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: #185FA5; border-radius: 2px; transition: width 0.3s; }
  .section-label { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); letter-spacing: 0.05em; text-transform: uppercase; text-align: center; margin-bottom: 8px; min-height: 16px; }
  .card-area { perspective: 1200px; margin-bottom: 10px; }
  .card { width: 100%; min-height: 200px; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform 0.42s cubic-bezier(0.4,0,0.2,1); border-radius: 16px; }
  .card.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; border-radius: 16px; padding: 28px 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .card-front { background: var(--bg-card-front, #fff); border: 0.5px solid var(--color-border-tertiary); }
  .card-back { background: #E6F1FB; border: 0.5px solid #B5D4F4; transform: rotateY(180deg); }
  .card-main { font-size: 21px; font-weight: 500; color: var(--text-card-main, #111); line-height: 1.3; }  .card-secondary { font-size: 15px; color: #0C447C; line-height: 1.6; }
  .card-secondary { font-size: 15px; color: var(--text-card-sub, #0C447C); line-height: 1.6; }
  .card-spacer { height: 200px; }
  .card-tap-hint { font-size: 11px; color: var(--text-hint); opacity: 0.6; margin-top: 14px; }  .card-counter { text-align: center; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; }
  .nav-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
  .quiz-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .quiz-score { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
  .score-pill { font-size: 13px; padding: 4px 14px; border-radius: 999px; }
  .score-pill.got { background: #EAF3DE; color: #3B6D11; }
  .score-pill.missed { background: #FCEBEB; color: #A32D2D; }
  .broken-section { background: #FCEBEB; border: 0.5px solid #F7C1C1; border-radius: 8px; padding: 10px 14px; margin-top: 14px; }
  .broken-title { font-size: 12px; font-weight: 500; color: #A32D2D; margin-bottom: 4px; }
  .broken-list { font-size: 11px; color: #993556; list-style: none; }
  .broken-list li { padding: 2px 0; font-family: var(--font-mono, monospace); word-break: break-all; }
  .done-screen { text-align: center; padding: 30px 16px; }
  .done-title { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 8px; }
  .done-sub { font-size: 15px; color: var(--color-text-secondary); margin-bottom: 20px; }
  .done-stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .done-stat { padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; }
  .done-stat.got { background: #EAF3DE; color: #3B6D11; }
  .done-stat.missed { background: #FCEBEB; color: #A32D2D; }
  .toggle-row { display: flex; gap: 6px; align-items: center; }
  .toggle-label { font-size: 12px; color: var(--color-text-secondary); }
  .toggle-wrap { display: flex; align-items: center; gap: 6px; background: var(--color-background-secondary, #ece9e0); border-radius: 999px; padding: 3px 8px; cursor: pointer; border: 0.5px solid var(--color-border-tertiary); }
  .toggle-wrap input { display: none; }
  .toggle-track { width: 28px; height: 16px; border-radius: 8px; background: #ccc; position: relative; transition: background 0.2s; }
  .toggle-track.on { background: #185FA5; }
  .toggle-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; transition: left 0.2s; }
  .toggle-track.on .toggle-thumb { left: 14px; }
  .color-btn { font-size: 18px; background: none; border: none; cursor: pointer; padding: 2px 4px; line-height: 1; }

  
</style>
</head>
<body class="theme-0">
<h2 class="sr-only">Flashcard app — tap a card to flip and reveal its answer.</h2>
<div class="app">
  <div class="header">
    <span class="title">Flashcards</span>
    <div class="header-right">
      <span class="stat" id="stat-total">0 cards</span>
      <span class="stat warn" id="stat-broken" style="display:none" onclick="toggleBroken()"></span>
      <button class="color-btn" onclick="cycleTheme()" title="Change background color">🎨</button>
    </div>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('study')" id="mode-study">Study</button>
    <button class="mode-btn" onclick="setMode('quiz')" id="mode-quiz">Quiz</button>
  </div>

  <div class="filter-bar">
    <select id="section-filter" onchange="applyFilter()">
      <option value="all">All sections</option>
    </select>
    <div class="toggle-wrap" onclick="toggleFlip()" title="Swap front/back">
      <div class="toggle-track" id="flip-toggle-track"><div class="toggle-thumb"></div></div>
      <span style="font-size:12px; color:var(--color-text-secondary);" id="flip-toggle-label">Term first</span>
    </div>
  </div>

  <div class="filter-bar" id="study-controls">
    <button class="btn" onclick="shuffle()">Shuffle</button>
    <button class="btn" onclick="reset()">Reset</button>
  </div>

  <div id="study-view">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="card-counter" id="card-counter"></div>
    <div class="section-label" id="current-section"></div>
    <div class="card-area">
      <div class="card" id="card" onclick="flipCard()">
        <div class="card-face card-front"><span class="card-main" id="card-front-text">Loading...</span><span class="card-tap-hint">tap to flip</span></div>
        <div class="card-face card-back"><span class="card-secondary" id="card-back-text"></span></div>
      </div>
      <div class="card-spacer"></div>
    </div>
    <div class="nav-row">
      <button class="btn" onclick="navigate(-1)">← Prev</button>
      <button class="btn" onclick="navigate(1)">Next →</button>
    </div>
  </div>

  <div id="quiz-view" style="display:none">
    <div class="quiz-score">
      <span class="score-pill got" id="quiz-got">✓ 0 got it</span>
      <span class="score-pill sorta" id="quiz-sorta">〜 0 sorta</span>
      <span class="score-pill missed" id="quiz-missed">✗ 0 missed</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="quiz-progress"></div></div>
    <div class="card-counter" id="quiz-counter"></div>
    <div class="section-label" id="quiz-section"></div>
    <div class="card-area">
      <div class="card" id="quiz-card" onclick="quizFlip()">
        <div class="card-face card-front"><span class="card-main" id="quiz-front-text"></span><span class="card-tap-hint">tap to reveal</span></div>
        <div class="card-face card-back"><span class="card-secondary" id="quiz-back-text"></span></div>
      </div>
      <div class="card-spacer"></div>
    </div>
    <div class="quiz-row" id="quiz-answer-row" style="display:none">
      <button class="btn bad" onclick="quizAnswer('missed')">✗ Didn't know</button>
      <button class="btn sorta" onclick="quizAnswer('sorta')">〜 Sorta</button>
      <button class="btn good" onclick="quizAnswer('got')">✓ Got it</button>
    </div>
    <div style="text-align:center; font-size:11px; color:var(--color-text-secondary); opacity:0.6; margin-top:4px;" id="quiz-key-hint" style="display:none">← didn't · ↓ sorta · → got it</div>
    <div class="nav-row" id="quiz-wait-row">
      <span style="font-size:13px; color:var(--color-text-secondary);">Tap the card to reveal the answer</span>
    </div>
  </div>

  <div id="done-screen" style="display:none">
    <div class="done-screen">
      <div class="done-title">Round complete!</div>
      <div class="done-sub" id="done-sub"></div>
      <div class="done-stats">
        <div class="done-stat got" id="done-got"></div>
        <div class="done-stat" style="background:#FFF3CD;color:#8a6000;" id="done-sorta"></div>
        <div class="done-stat missed" id="done-missed"></div>
      </div>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn primary" onclick="restartQuiz(false)">Restart all</button>
        <button class="btn" onclick="restartQuiz(true)" id="retry-missed-btn">Retry missed &amp; sorta</button>
      </div>
    </div>
  </div>

  <div id="broken-container" style="display:none"></div>
</div>

<script>
const RAW_NOTES = `---Life Insurance Policies---
Adjustable life insurance (often called universal life):::A type of permanent life insurance that lets you change your policy's features as your financial situation evolves. (Allows the policyowner to change both the premium amount and the face amount of the policy.)
Cash value life insurance:::A permanent policy where a portion of your premium goes toward an accumulating tax-deferred savings account. You can access these funds during your lifetime by taking tax-free policy loans or withdrawals, though it will reduce the ultimate death benefit.
Credit Life Insurance:::A specialized, optional policy designed to pay off a borrower's outstanding debt (such as a mortgage, car loan, or large credit line) if the policyholder dies before it is fully repaid.
Decreasing Term policy:::Overtime, the death benefit decreases while the premium stays level. This is for loan-coverage.
Last Survivor Life insurance:::covers two or more people with the death benefit payable upon the last person's death?
Renewable Term Life insurance policy:::the policy can be renewed at specified intervals without evidence of insurability. Premiums usually increase with age. (at a predetermined date or age, regardless of the insured's health)
Survivorship life policy:::multiple protection policy pays on the death of the last person
Universal life (UL) insurance:::is a permanent life insurance policy that lasts your entire life and features flexible premiums and adjustable death benefits. It includes a cash-value savings component that earns interest, which you can borrow against or use to pay premiums—though mismanaging it risks the policy lapsing.
Variable Universal Life Policy:::Takes the flexible premium payments and adjustable death benefits inherent to a standard universal life policy and introduces the ability to allocate cash value into a variety of separate investment subaccounts like stocks, bonds, or mutual funds
Whole life insurance policy (aka straight life):::(the insurer bears the investment risk) A permanent policy that provides lifelong coverage, a guaranteed death benefit, and a built-in cash value account that grows at a fixed, tax-deferred rate. It features level premiums that never increase, but costs significantly more than term life insurance.


---Health Insurance---
Critical Illness Plan:::Generally cover multiple illnesses and provide a lump sum upon diagnosis.
Guaranteed renewable policies:::Assures renewability up to a specific age of the insured, although the company reserves the right to change the premium rate on a class basis?
Indemnity Plan:::An insurance policy that reimburse the insured directly for covered services.
Noncancellable policies:::Guarantee renewal and guarantee the insurer cannot change premiums for the individual.


---Group Insurance---
Certificate of Insurance:::After enrolling in a group plan, an employee receives what summarizing their coverage and rights.
Group disability insurance:::Employer-sponsored coverage that replaces part of your income if illness or injury prevents you from working.
Group health insurance underwriting:::evaluates the group as a single entity, not individual members.
Group Insurance:::A broad term for insurance that covers a group of people under one master policy, usually employees of a company.
Group term life:::(A full-time employee who has been on the job 2 years)
Master policy:::A single contract for group insurance issued to an employer.
Non-contributory group health insurance plan:::(avoids adverse selection) is an employer-sponsored health insurance policy where the employer pays the entire premium cost for eligible employees. Employees are not required to make financial contributions, and no premium is deducted from their paychecks.
Small Group Insurance:::1-50 employees can be on this plan.


---Other Insurance Policies and Options---
Business Overhead Expense (BOE):::is a policy specifically designed to cover the ongoing costs of running a business — such as rent, utilities, and employee salaries — while the owner is disabled.
Life annuity certain:::guarantees a minimum number of payments — if the annuitant dies early, the beneficiary receives the remaining guaranteed payments.
Life income:::the settlement option that provides the highest income to the annuitant but leaves nothing for a beneficiary — all payments end at death.
Modified Endowment Contract (MEC):::A designation given to cash value life insurance contracts that exceed legal tax limits .
nonforfeiture provision:::an insurance clause that guarantees policyholders will not lose their accumulated cash value or benefits if a permanent policy lapses due to missed payments or is actively canceled. It ensures the equity built into the policy remains yours.
Reinstated policy:::covers sickness starting 10 days after reinstatement to avoid pre-existing condition claims. (need proof of insurability usually)
Wagering Contract:::(no insurable interest) two parties promise to exchange money or assets based entirely on the outcome of an uncertain future event.


---People and Institutions---
Actuaries:::Assess risk but do not administer self-insured health programs.
Attending physician:::A fully licensed, board-certified doctor who has completed all medical training.
Commissioner (sometimes called a Director):::A state-level official who regulates the insurance industry, protects consumers, and ensures companies remain financially solvent.
Department of Insurance and Financial Services (DIFS):::Regulates banks, credit unions, insurance companies, and mortgage lenders to protect consumers.
Health Maintenance Organization (HMO):::A type of health insurance plan that provides care through a specific network of doctors and hospitals. It generally requires members to use in-network providers, select a Primary Care Provider (PCP), and get referrals to see specialists.
Insurer (often called an insurance company or insurance carrier):::The entity or organization that issues the policy. In exchange for your regular premium payments, the insurer assumes the financial risk and promises to compensate you for covered losses or damages.
Multi-line insurers:::Companies that sell more than one type of insurance are
National Association of Insurance Commissioners (NAIC):::Standard-setting and regulatory support organization. Promotes uniform insurance laws and helps protect consumers.
Primary Care Provider (PCP):::Your main healthcare professional who manages your routine health needs, preventive care, and ongoing wellness.


---Underwriting---
Underwriting::: the process where financial institutions—like banks, insurers, or investment firms—assess the risk of a proposed financial transaction to determine its viability, terms, and pricing.
Underwriting does not require:::an insurance license.
Non-competent parties:::A person's legal competence to enter into a contract; incompetence is determined by age, mental capacity, or intoxication.
Primary risk factors:::Moral hazards, physical conditions, and occupation.
Investigative Consumer Report:::Assess character and personal habits through third-party interviews.
Inspection Report:::assess an applicant's character and reputation.
APS (attending physician's statement):::Is requested by the insurer to obtain medical details for underwriting purposes.
The producer's/agent's report:::Generally provides underwriting with the producer's personal observations about the applicant.
A substandard applicant:::Can never be rejected outright by the insurer
The underwriting process begins:::Immediately after an insurance application is submitted and the initial premium is paid.


---MIB---
Medical Information Bureau (MIB):::To help underwriters evaluate risk
A MIB report:::Is best described as medical impairment information used to assess life or health insurance risk.
THe MIB:::underwriting source acts as an information exchange by collecting general medical impairment data used by insurers?


---Laws and Codes---
Affordable Care Act (ACA):::Cost-sharing reductions require enrollment in a silver plan. (must cover hospitalization)
Consolidated Omnibus Budget Reconciliation Act (COBRA):::Allows terminated employees to continue group health insurance by paying the premiums themselves.
Courts determining the intent of the parties:::Consider the entire contract.
Health Insurance Portability and Accountability Act (HIPAA):::Federal U.S. law that sets national standards for protecting sensitive patient health information. Must relate to health status, healthcare, or payment for healthcare and be capable of identifying the individual. (do not apply to disability income plans)
Illegal inducement does not occur when:::You are not bribing. Giving out a promotional item to the producer is fine as you are not persuading them into anything.
Law of Agency:::an appointed producer acts on behalf of the insurer for authorized activities.
Legal Purpose:::Requires that the reasons for entering into a contract must be lawful and not against public policy.
Michigan Insurance Code, Chapter 45:::Financial loss can be defined as 'loss of income'. Cannot be defined as "additional premiums.' 
Section 1035:::allows tax-free exchanges only between like-kind insurance products, but an annuity cannot be exchanged for a life insurance policy.
Section 125 Plan:::It allows employees to pay for qualified benefits, such as health insurance premiums and dependent care, using pre-tax income, which lowers both the employee's taxable income and the employer's payroll taxes.


---Clauses---
Consideration clause:::states that the policy is issued in exchange for the application representations and the premium payment.
Incontestable clause:::prevents a provider from voiding coverage or denying a death benefit due to misstatements, omissions, or errors on the initial application after a specific timeframe has passed. (age is commonly wrong)
Standard Suicide Clause:::After the suicide clause period ends, the death benefit is payable.
change-of-occupation clause:::Moving to a higher-risk job can reduce the disability benefit to the amount the premium would have bought for that class. is NOT a required provision in an accident and health insurance policy


---Certificates and Reports---
Binding receipt:::A temporary agreement issued by an insurer upon receiving your application and initial premium payment. It provides immediate, provisional coverage while the company evaluates your application and goes through the underwriting process.
Certificate of insurance:::A standardized document issued by an insurance company that serves as quick, verifiable proof of your active insurance coverage. It summarizes essential details like the policyholder’s name, types of coverage, policy limits, and effective dates.
Conditional Receipt:::an insurance document issued to an applicant who pays their initial premium at the time of application. It provides temporary coverage during the underwriting process, but only on the condition that the applicant meets the company’s insurability standards when the application or medical exam is completed.
Disclosure authorization response:::Is simply a legal form or receipt confirming that the applicant has granted consent to the insurance company to collect, share, or look up their private data.
Entire Contract::: A provision that ensures the application is part of the issued policy.
Producer's report:::A confidential report from the producer to the insurer's underwriter, providing observations and context relevant to underwriting.
When coverage becomes effective:::The primary distinction between the insurability and approval types of conditional receipts is when?


---Rider---
Child term rider:::is an add-on to a parent’s life insurance policy that provides coverage for dependent children. It pays a death benefit if a child passes away while the rider is active, making it a cost-effective way to cover all your children (including future ones) under a single, flat fee
Family Term Rider:::Allows both the spouse and children to be added to the primary insured's life insurance coverage.
Guaranteed insurability rider:::allows her to purchase additional insurance at specific dates or events without evidence of insurability.
Payor rider:::guarantees premium payments on a juvenile policy if the payor dies or becomes disabled.
Rider:::An optional add-on or amendment to a base policy that alters, expands, or restricts coverage. Often referred to as an endorsement or floating provision, a rider allows you to customize your plan to fit specific needs, usually for a slightly higher premium
Term Rider:::Provide coverage on additional family members.
Waiver of premium rider:::is an optional life insurance add-on that prevents your policy from lapsing if you become seriously ill or disabled and are unable to work. The insurance company waives or pays your premiums during this time, allowing you to maintain your coverage without further out-of-pocket payments.


---Annuity---
Annuity Certain:::(also known as a period certain or term certain annuity) is a financial contract that guarantees fixed payments for a specific number of years, regardless of how long the annuitant lives.
Deferred annuity:::an insurance contract that allows you to invest money over time and accumulate funds tax-deferred. It begins paying a guaranteed, steady stream of income at a future date you choose—usually during retirement. The interest earned is (On a tax-deferred basis) but withdrawels may be taxed.
Fixed immediate annuity:::You exchange a lump-sum for a guaranteed, predictable stream of income that begins right away, typically within 30 days. It functions like a personal pension, eliminating market risk and providing reliable cash flow. Payment amounts are determined by three factors: starting principal, interest rate, and the length of the income period.
Variable Annuity:::Link values to investment performance and can hedge inflation.


---Disability---
Accidental Death and Dismemberment (AD&D):::AD&D is a specialized supplemental insurance policy (often offered through employers) that pays a cash benefit if you die or suffer severe physical injuries (such as losing limbs or eyesight) in a covered accident.
Disability income coverage:::A contract feature that guarantees income replacement if an illness or injury prevents you from working.
Income replacement disability policies (disability):::May pay even when some duties can still be performed, depending on the disability definition.
Key Person Disability Insurance:::pays benefits to the employer to offset financial losses caused by a key employee's disability.
Loss of income:::Insurance point of view of the main risk of disability.
Own occupation clause:::defines total disability as being unable to perform the major duties of the insured's regular occupation? Like brick layer breaks hand, but still get's full disabilty as a substitute teacher.
Recurrent disability provisions:::You can start receiving benefits again from a disability that came back without waiting another 90 days.
Partial Disability:::pays benefits when an insured can still work but cannot perform all major job duties, resulting in a loss of income.
Presumptive Disability:::a provision where specific severe medical conditions are automatically assumed to qualify for disability benefits.


---Healthcare and hospital stay---
Concurrent review:::monitors the necessity and duration of hospital stays to manage care and costs.
Health Savings Account (HSA):::A tax-advantaged medical savings account available to individuals enrolled in a High-Deductible Health Plan (HDHP). It acts like a "401(k) for healthcare," allowing you to contribute pre-tax money, grow earnings tax-free, and withdraw funds tax-free for qualified medical expenses
Hospital indemnity policy:::pays a fixed daily (or per confinement) benefit. "pays a stated benefit amount based on hospitalization duration, not actual expenses."
Mandatory second surgical opinions:::are a cost-control measure used by health insurers to evaluate the necessity of surgeries.

function parseNotes(raw) {
  const lines = raw.split('\n');
  const cards = [], broken = [];
  let currentSection = 'Section';
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line || line === '~~END') continue;
    if (line.startsWith('---') && line.endsWith('---') && line.length > 6) {
      const inner = line.slice(3, -3).trim();
      if (inner) { currentSection = inner; continue; }
      else { broken.push(line); continue; }
    }
    if (line.includes(':::')) {
      const idx = line.indexOf(':::');
      const word = line.slice(0, idx).trim();
      const def = line.slice(idx + 3).trim();
      if (!word && !def) continue;
      cards.push({ word: word || '(no term)', def: def || '(no definition)', section: currentSection });
      continue;
    }
    if (line.includes('::') && !line.includes(':::')) { broken.push(line); continue; }
    if (/^-+[^-].*[^-]-+$/.test(line) || (line.startsWith('-') && !line.startsWith('---'))) { broken.push(line); continue; }
  }
  return { cards, broken };
}

let allCards = [], filteredCards = [], brokenLines = [];
let currentIndex = 0, isFlipped = false, defFirst = false;
let currentMode = 'study';
let themeIndex = 0;
const themes = ['theme-0','theme-1','theme-2'];

let quizCards = [], quizIndex = 0, quizGot = 0, quizSorta = 0, quizMissed = 0, quizRevealed = false;
// quizStatus: map from card index in quizCards to { sortaStreak, needed }
// needed: how many consecutive sortas needed to retire (starts at 2, after a miss resets to 1 more)
let quizStatus = [], quizQueue = [], quizQueueIndex = 0;

function init() {
  const { cards, broken } = parseNotes(RAW_NOTES);
  allCards = cards; brokenLines = broken;
  const sel = document.getElementById('section-filter');
  const sections = [...new Set(cards.map(c => c.section))];
  sections.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  applyFilter();
  renderBroken();
}

function applyFilter() {
  const val = document.getElementById('section-filter').value;
  filteredCards = val === 'all' ? [...allCards] : allCards.filter(c => c.section === val);
  currentIndex = 0; isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  renderStudy();
  updateStatTotal();
}

function updateStatTotal() {
  document.getElementById('stat-total').textContent = filteredCards.length + ' cards';
}

function renderStudy() {
  if (!filteredCards.length) {
    document.getElementById('card-front-text').textContent = 'No cards.';
    document.getElementById('card-back-text').textContent = '';
    document.getElementById('current-section').textContent = '';
    document.getElementById('card-counter').textContent = '';
    document.getElementById('progress').style.width = '0%';
    return;
  }
  const c = filteredCards[currentIndex];
  document.getElementById('card-front-text').textContent = defFirst ? c.def : c.word;
  document.getElementById('card-back-text').textContent = defFirst ? c.word : c.def;
  document.getElementById('current-section').textContent = c.section;
  document.getElementById('card-counter').textContent = (currentIndex + 1) + ' / ' + filteredCards.length;
  document.getElementById('progress').style.width = Math.round(((currentIndex + 1) / filteredCards.length) * 100) + '%';
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped', isFlipped);
}

function navigate(dir) {
  if (!filteredCards.length) return;
  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  currentIndex = (currentIndex + dir + filteredCards.length) % filteredCards.length;
  renderStudy();
}

function shuffle() {
  for (let i = filteredCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
  }
  currentIndex = 0; isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  renderStudy();
}

function startQuiz(pool) {
  // Shuffle pool
  quizCards = [...pool];
  for (let i = quizCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizCards[i], quizCards[j]] = [quizCards[j], quizCards[i]];
  }
  quizGot = 0; quizSorta = 0; quizMissed = 0; quizRevealed = false;
  // Status: each card starts with sortaStreak=0, needed=2
  quizStatus = quizCards.map(() => ({ sortaStreak: 0, needed: 2, retired: false }));
  // Build initial queue: indices of all cards
  quizQueue = quizCards.map((_, i) => i);
  quizQueueIndex = 0;
  document.getElementById('quiz-view').style.display = '';
  document.getElementById('done-screen').style.display = 'none';
  document.getElementById('quiz-card').classList.remove('flipped');
  renderQuizCard();
  updateQuizScore();
}

function renderQuizCard() {
  const remaining = quizQueue.filter(i => !quizStatus[i].retired);
  if (remaining.length === 0) { showDone(); return; }
  // Find current position in queue skipping retired
  while (quizQueueIndex < quizQueue.length && quizStatus[quizQueue[quizQueueIndex]].retired) {
    quizQueueIndex++;
  }
  if (quizQueueIndex >= quizQueue.length) { showDone(); return; }
  quizIndex = quizQueue[quizQueueIndex];
  const c = quizCards[quizIndex];
  document.getElementById('quiz-front-text').textContent = defFirst ? c.def : c.word;
  document.getElementById('quiz-back-text').textContent = defFirst ? c.word : c.def;
  document.getElementById('quiz-section').textContent = c.section;
  const total = quizCards.length;
  const retired = quizStatus.filter(s => s.retired).length;
  document.getElementById('quiz-counter').textContent = retired + ' / ' + total + ' mastered · ' + remaining.length + ' remaining';
  document.getElementById('quiz-progress').style.width = Math.round((retired / total) * 100) + '%';
  quizRevealed = false;
  document.getElementById('quiz-card').classList.remove('flipped');
  document.getElementById('quiz-answer-row').style.display = 'none';
  document.getElementById('quiz-key-hint').style.display = 'none';
  document.getElementById('quiz-wait-row').style.display = '';
}

function quizFlip() {
  quizRevealed = !quizRevealed;

  document.getElementById('quiz-card').classList.toggle('flipped', quizRevealed);

  if (quizRevealed) {
    document.getElementById('quiz-answer-row').style.display = 'flex';
    document.getElementById('quiz-wait-row').style.display = 'none';
    document.getElementById('quiz-key-hint').style.display = '';
  } else {
    document.getElementById('quiz-answer-row').style.display = 'none';
    document.getElementById('quiz-wait-row').style.display = '';
    document.getElementById('quiz-key-hint').style.display = 'none';
  }
}

  const st = quizStatus[quizIndex];

    st.retired = true;
    // Only mark as clean if never had trouble
  } else if (result === 'sorta') {
    quizSorta++;
    st.hadTrouble = true;
    st.sortaStreak++;
    if (st.sortaStreak >= st.needed) {
      st.retired = true;
    } else {
      const offset = 3 + Math.floor(Math.random() * 3);
      const insertAt = quizQueueIndex + offset;
      quizQueue.splice(Math.min(insertAt, quizQueue.length), 0, quizIndex);
    }
  } else { // missed
    quizMissed++;
    st.hadTrouble = true;
    st.sortaStreak = 0;
    st.needed = 1; // After a miss, just 1 sorta in a row retires it
    const offset = 3 + Math.floor(Math.random() * 3);
    const insertAt = quizQueueIndex + offset;
    quizQueue.splice(Math.min(insertAt, quizQueue.length), 0, quizIndex);
  }
  updateQuizScore();
  quizQueueIndex++;
  renderQuizCard();
}

function updateQuizScore() {
  document.getElementById('quiz-got').textContent = '✓ ' + quizGot + ' got it';
  document.getElementById('quiz-sorta').textContent = '〜 ' + quizSorta + ' sorta';
  document.getElementById('quiz-missed').textContent = '✗ ' + quizMissed + ' missed';
}

function showDone() {
  document.getElementById('quiz-view').style.display = 'none';
  document.getElementById('done-screen').style.display = '';
  const total = quizCards.length;
  document.getElementById('done-sub').textContent = 'You mastered all ' + total + ' cards!';
  document.getElementById('done-got').textContent = '✓ ' + quizGot + ' got it';
  document.getElementById('done-sorta').textContent = '〜 ' + quizSorta + ' sorta';
  document.getElementById('done-missed').textContent = '✗ ' + quizMissed + ' missed';
  document.getElementById('retry-missed-btn').style.display = (quizMissed > 0 || quizSorta > 0) ? '' : 'none';
}

function restartQuiz(missedOnly) {
  document.getElementById('done-screen').style.display = 'none';
  document.getElementById('quiz-view').style.display = '';
  if (missedOnly) {
    // Retry cards that were missed OR needed multiple sortas (weren't clean first-try gets)
    const retryPool = quizCards.filter((_, i) => quizStatus[i].hadTrouble);
    startQuiz(retryPool.length > 0 ? retryPool : filteredCards);
  } else {
    startQuiz(filteredCards);
  }
}

function toggleBroken() {
  const c = document.getElementById('broken-container');
  c.style.display = c.style.display === 'none' ? '' : 'none';
}

function renderBroken() {
  if (!brokenLines.length) return;
  const el = document.getElementById('stat-broken');
  el.style.display = '';
  el.textContent = brokenLines.length + ' broken line' + (brokenLines.length !== 1 ? 's' : '') + ' (tap)';
  const c = document.getElementById('broken-container');
  const ul = brokenLines.map(b => `<li>${b.length > 80 ? b.slice(0,80)+'…' : b}</li>`).join('');
  c.innerHTML = `<div class="broken-section"><div class="broken-title">${brokenLines.length} formatting issue${brokenLines.length!==1?'s':''}</div><ul class="broken-list">${ul}</ul></div>`;
  c.style.display = 'none';
}

document.addEventListener('keydown', e => {
  if (currentMode === 'study') {
    if (e.key === 'ArrowRight') navigate(1);
    else if (e.key === 'ArrowLeft') navigate(-1);
    else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  } else if (currentMode === 'quiz') {
    if (e.key === ' ') { e.preventDefault(); if (!quizRevealed) quizFlip(); }
    else if (e.key === '1' && quizRevealed) quizAnswer('missed');
    else if (e.key === '2' && quizRevealed) quizAnswer('sorta');
    else if (e.key === '3' && quizRevealed) quizAnswer('got');
    else if (e.key === 'ArrowRight' && quizRevealed) quizAnswer('got');
    else if (e.key === 'ArrowLeft' && quizRevealed) quizAnswer('missed');
    else if (e.key === 'ArrowDown' && quizRevealed) quizAnswer('sorta');
  }
});

document.addEventListener('dblclick', function(e) {
  e.preventDefault();
}, { passive: false });

init();
</script>
</body>
